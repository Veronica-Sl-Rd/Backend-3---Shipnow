paths:

  /api/mocks/mockingusers:
    get:
      tags:
        - Mocks
      summary: Obtener usuarios mock
      description: Genera usuarios y repartidores simulados sin almacenarlos en MongoDB.
      parameters:
        - name: quantity
          in: query
          required: false
          description: Cantidad de usuarios y repartidores a generar. Debe ser un entero mayor que 0 y menor o igual a 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Datos mock generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: object
                    properties:
                      customers:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      drivers:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "400":
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mocks/mockingorders:
    get:
      tags:
        - Mocks
      summary: Obtener pedidos mock
      description: Genera pedidos simulados asociados a usuarios ficticios sin almacenarlos en MongoDB.
      parameters:
        - name: quantity
          in: query
          required: false
          description: Cantidad de pedidos a generar.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Pedidos mock generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mocks/generateData:
    post:
      tags:
        - Mocks
      summary: Generar y almacenar datos de prueba
      description: Genera usuarios, repartidores, pedidos y entregas de prueba y los almacena en MongoDB.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 50
                  example: 10
      responses:
        "201":
          description: Datos de prueba generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Datos de prueba generados correctamente
                  payload:
                    type: object
                    properties:
                      users:
                        type: integer
                        example: 10
                      drivers:
                        type: integer
                        example: 10
                      orders:
                        type: integer
                        example: 10
                      deliveries:
                        type: integer
                        example: 10
        "400":
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Fallo durante la generación o persistencia de datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"