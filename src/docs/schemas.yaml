components:

  schemas:

    User:
      type: object
      properties:
        _id:
          type: string
          example: "67d123456789abcdef123456"
        firstName:
          type: string
          example: "Veronica"
        lastName:
          type: string
          example: "Rodriguez"
        email:
          type: string
          format: email
          example: "vero@example.com"
        password:
          type: string
          example: "*******"
        role:
          type: string
          enum: [admin, customer, driver, store]
          example: customer
        city:
          type: string
          example: "Buenos Aires"
        available:
          type: boolean
          example: true
        vehicle:
          type: string
          enum: [bike, motorcycle, car]
          example: motorcycle
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentMetadata"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentMetadata:
      type: object
      properties:
        originalName:
          type: string
          example: dni.pdf
        filename:
          type: string
          example: 1788280000000-458123.pdf
        path:
          type: string
          example: uploads/documents/1788280000000-458123.pdf
        mimetype:
          type: string
          example: application/pdf
        size:
          type: integer
          example: 245821
        documentType:
          type: string
          enum:
            - dni
            - license
            - other
        uploadedAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: "Veronica"
        lastName:
          type: string
          example: "Rodriguez"
        email:
          type: string
          format: email
          example: "vero@example.com"
        password:
          type: string
          writeOnly: true
          example: "*******"
        role:
          type: string
          enum: [customer, driver, store]
          default: customer
          description: No se permite crear usuarios con rol admin desde este endpoint.
        city:
          type: string
          example: Buenos Aires
        available:
          type: boolean
          default: true
        vehicle:
          type: string
          enum: [bike, motorcycle, car]
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentMetadata"

    OrderItem:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          example: "Hamburguesa"
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 1500

    Order:
      type: object
      properties:
        _id:
          type: string
          example: "67d123456789abcdef123456"
        customer:
          type: string
          example: "67d123456789abcdef123456"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: "Av. Siempre Viva 1234"
        total:
          type: number
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
        delivery:
          type: string
          nullable: true
          example: "67d123456789abcdef654321"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required:
        - customer
        - items
        - deliveryAddress
      properties:
        customer:
          type: string
          description: ID del cliente que realiza el pedido
          example: "67d123456789abcdef123456"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: "Av. Siempre Viva 1234"
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: normal
        paymentMethod:
          type: string
          description: Método de pago; si se omite, el servicio utiliza card
          example: card

    OrderUpdate:
      type: object
      description: Campos del pedido que se desean actualizar.
      properties:
        customer:
          type: string
          example: "67d123456789abcdef123456"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: "Av. Siempre Viva 1234"
        total:
          type: number
          example: 3000
        status:
          type: string
          enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
        priority:
          type: string
          enum: [low, normal, high]
        delivery:
          type: string
          nullable: true
          example: "67d123456789abcdef654321"

    Delivery:
      type: object
      properties:
        _id:
          type: string
          example: "67d123456789abcdef123456"
        order:
          type: string
          example: "67d123456789abcdef123456"
        driver:
          type: string
          nullable: true
          example: "67d123456789abcdef654321"
        status:
          type: string
          enum: [pending, assigned, in_transit, delivered]
          example: pending
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
        assignedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        proof:
          $ref: "#/components/schemas/DeliveryProof"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeliveryInput:
      type: object
      required:
        - order
      properties:
        order:
          type: string
          description: ID del pedido asociado a la entrega
          example: "67c8f123456789abcdef1234"
        driver:
          type: string
          nullable: true
          description: ID del repartidor asignado
          example: "67c8f987654321abcdef5678"
        status:
          type: string
          enum: [pending, assigned, in_transit, delivered]
          default: pending
          description: Estado actual de la entrega
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          description: Prioridad de la entrega
        assignedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora de asignación del repartidor
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora de entrega

    DeliveryUpdate:
      type: object
      description: Campos de la entrega que se desean actualizar.
      properties:
        order:
          type: string
          description: ID del pedido asociado
          example: "67c8f123456789abcdef1234"
        driver:
          type: string
          nullable: true
          description: ID del repartidor asignado
          example: "67c8f987654321abcdef5678"
        status:
          type: string
          enum: [pending, assigned, in_transit, delivered]
          example: in_transit
        priority:
          type: string
          enum: [low, normal, high]
          example: normal
        assignedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    DeliveryProof:
      type: object
      nullable: true
      properties:
        originalName:
          type: string
          example: comprobante.jpg
        filename:
          type: string
          example: 1788280000000-827364.jpg
        path:
          type: string
          example: uploads/delivery-proofs/1788280000000-827364.jpg
        mimetype:
          type: string
          example: image/jpeg
        size:
          type: integer
          example: 182731
        documentType:
          type: string
          example: delivery_proof
        uploadedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: ORDER_NOT_FOUND
        message:
          type: string
          example: Pedido no encontrado

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          type: object